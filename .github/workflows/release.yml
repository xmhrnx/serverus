# Builds every platform when a GitHub release is published and adds the
# packages to it.
#
# Started from `giode ci` (with [ci] trigger = "release") and then edited
# by hand; don't regenerate it with `giode ci -f`, which would undo the
# version handling below.
#
# The release tag is the full version, major.minor.patch.versionCode, as
# gogio numbers Android builds: 1.0.0.0, or v1.0.0.0. The first three
# parts become app.version (versionName on Android, the version shown on
# every platform) and the fourth app.build (Android's versionCode, iOS's
# CFBundleVersion). Google Play needs the versionCode to grow with every
# upload, and the giode CLI treats a build of 0 as 1.
name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      build: ${{ steps.parse.outputs.build }}
    steps:
      - name: Read the version from the release tag
        id: parse
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          v="${TAG#v}"
          if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::The release tag '$TAG' must be major.minor.patch.versionCode, like 1.0.0.0"
            exit 1
          fi
          echo "version=${v%.*}" >> "$GITHUB_OUTPUT"
          echo "build=${v##*.}" >> "$GITHUB_OUTPUT"
          echo "Version ${v%.*}, Android versionCode ${v##*.}" >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev
      - name: Test (giode.toml ci.test)
        run: |
          go test ./...

  linux:
    needs: [version, test]
    env:
      GIODE_VERSION: ${{ needs.version.outputs.version }}
      GIODE_BUILD: ${{ needs.version.outputs.build }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            primary: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev nsis osslsigncode
          go install github.com/mehran9675/giode-cli/cmd/giode@latest
      - name: Signing keys
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore; fi
          if [ -n "$WINDOWS_CERT_BASE64" ]; then echo "$WINDOWS_CERT_BASE64" | base64 -d > codesign.pfx; fi
      - name: Build Linux packages
        run: giode build deb rpm
      - name: Build Windows
        if: matrix.primary
        env:
          GIODE_WINDOWS_CERT_PASS: ${{ secrets.GIODE_WINDOWS_CERT_PASS }}
        run: |
          # Signed when the repository has the certificate.
          win=""; if [ -n "$GIODE_WINDOWS_CERT_PASS" ]; then win="-release"; fi
          giode build $win -arch amd64 windows-installer msix
      - name: Install bundletool
        if: matrix.primary
        env:
          BUNDLETOOL_VERSION: "1.18.1"
        run: |
          # giode build aab runs Google's bundletool from the SDK's
          # build-tools folder, which the runner image doesn't include.
          curl -fsSL -o bundletool.jar "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          sha256sum bundletool.jar
          for d in "$ANDROID_HOME"/build-tools/*/; do cp bundletool.jar "$d/bundletool-all-${BUNDLETOOL_VERSION}.jar"; done
          rm bundletool.jar
      - name: Build Android
        if: matrix.primary
        env:
          GIODE_KEYSTORE_PASS: ${{ secrets.GIODE_KEYSTORE_PASS }}
        run: |
          # Signed when the repository has the keystore.
          apk=""; if [ -n "$GIODE_KEYSTORE_PASS" ]; then apk="-release"; fi
          giode doctor || true
          giode build $apk android aab
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          if-no-files-found: ignore
          path: |
            dist/linux/*.deb
            dist/linux/*.rpm
            dist/windows/*.exe
            dist/windows/*.msix
            dist/android/*.apk
            dist/android/*.aab
            dist/android/native-debug-symbols.zip

  macos:
    needs: [version, test]
    runs-on: macos-latest
    env:
      MACOS_CERT_BASE64: ${{ secrets.MACOS_CERT_BASE64 }}
      GIODE_VERSION: ${{ needs.version.outputs.version }}
      GIODE_BUILD: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go install github.com/mehran9675/giode-cli/cmd/giode@latest
      - name: Signing certificate
        if: env.MACOS_CERT_BASE64 != ''
        env:
          MACOS_CERT_PASS: ${{ secrets.MACOS_CERT_PASS }}
        run: |
          echo "$MACOS_CERT_BASE64" | base64 -d > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12
      - name: Build
        env:
          GIODE_NOTARY_PASS: ${{ secrets.GIODE_NOTARY_PASS }}
        run: |
          release=""
          if [ -n "$MACOS_CERT_BASE64" ]; then release="-release"; fi
          giode build $release dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/macos/*.dmg

  publish:
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          tag_name: ${{ github.event.release.tag_name }}
