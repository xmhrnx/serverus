# giode.toml configures how the giode CLI builds this app.
# Reference: https://github.com/xmhrnx/giode-cli#giodetoml

[app]
name = "Serverus"
id = "com.xmhrnx.serverus"            # reverse-DNS, unique to your app; stores never let it change
version = "0.1.0"
build = 1                    # raise for every store upload (giode bump)
icon = "assets/icon.png"
package = "."
platforms = ["windows", "macos", "linux", "android"]   # what giode build builds with no target named
publisher = "xmhrnx"
description = "Manage, monitor and connect to all your servers over SSH, Telnet, FTP or locally."
website = ""

[android]
min_sdk = 21
# Adaptive icon layers, drawn by scripts/make_icon.py. Without them the
# launcher shows white where app.icon's rounded corners are transparent.
icon_foreground = "assets/android-foreground.png"
icon_background = "assets/android-background.png"
permissions = ["network"]
# keep_alive = true          # lets App.KeepAlive keep work running in the background
# keystore = "release.keystore"   # created by giode keystore; signs giode build -release

[macos]
min_os = 11
# identity = "Developer ID Application: Your Name (TEAMID)"  # signs giode build -release
# notary_id = "you@example.com"     # notarizes, with the password in $GIODE_NOTARY_PASS
# notary_team_id = "TEAMID"

[windows]
arch = "amd64"
# cc = "x86_64-w64-mingw32-gcc"  # only for cgo apps linking C libraries

[windows.installer]
# per_machine = true         # install for all users into Program Files (asks for admin)
# desktop_shortcut = true
# license = "assets/license.txt"

[windows.msix]
# The signing certificate's subject. A Windows code-signing certificate
# (giode cert, or a bought one) must have exactly this subject, or the
# Partner Center publisher ID when the package goes to the Store.
publisher = "CN=xmhrnx"
# Lets the MSIX package start at login (Settings > Start at login).
startup_task = true

[windows.signing]
# certificate = "codesign.pfx"   # created by giode cert (testing) or bought; password in $GIODE_WINDOWS_CERT_PASS
# timestamp = "http://timestamp.digicert.com"

[linux]
categories = ["Network", "System", "Utility"]     # freedesktop menu categories
# license = "MIT"            # SPDX, for .deb, .rpm and AppStream

[ci]
trigger = "release"   # build when a GitHub release is published
build = "tag"         # the tag is major.minor.patch.versionCode (1.0.0.1); its last part is the build number
dispatch = false      # no "Run workflow" button: releases only
